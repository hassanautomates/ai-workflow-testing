name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Runs per suite for npm run prove (N)'
        default: '20'
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pushes and pull requests; a manual dispatch runs the proof instead.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload coverage manifests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-manifests
          path: reports/manifest/
          if-no-files-found: ignore
          retention-days: 14

  prove:
    # Manual only: variance runs, the naive baseline and one run per ENGINE_BUG.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prove
        # Passed through the environment, not interpolated into the command;
        # the script validates it as a positive integer.
        env:
          PROVE_RUNS: ${{ inputs.runs }}
        run: npm run prove

      - name: Upload prove.md
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: prove-report
          path: |
            reports/prove.md
            reports/prove/
          retention-days: 90
